[package]
name = "pdf-text-repair"
version = "0.2.2"
description = "A local desktop utility that rebuilds searchable PDF text layers and continuous reading layers with OCR."
authors = ["PDF Text Repair contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "pdf_text_repair_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
