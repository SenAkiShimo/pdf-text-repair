name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: read
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm install
      - run: npm run tauri build
      - name: Archive app bundle
        run: |
          if [ -d "src-tauri/target/release/bundle/macos/PDF Text Repair.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "src-tauri/target/release/bundle/macos/PDF Text Repair.app" \
              "src-tauri/target/release/bundle/PDF-Text-Repair-macOS.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Text-Repair-macOS-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/PDF-Text-Repair-macOS.zip
          if-no-files-found: error
