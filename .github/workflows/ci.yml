name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: python -m pip install --upgrade pip PyMuPDF
      - run: python -m py_compile src-tauri/resources/*.py
      - run: python src-tauri/resources/paddle_scan_pipeline.py --self-test
      - run: zsh -n scripts/*.command src-tauri/resources/*.command
      - run: npm install
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
